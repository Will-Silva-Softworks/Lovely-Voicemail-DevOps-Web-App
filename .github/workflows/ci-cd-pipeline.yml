name: Build and Deploy to Docker and AWS

on:
  push:
    branches:
      - main

# Required for OIDC Authentication to AWS
permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Build and push backend Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/lovely_voicemail_backend:latest

    - name: Build and push frontend Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/lovely_voicemail_frontend:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.9
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Configure AWS credentials
      id: aws-credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
        aws-region: us-east-1
        output-credentials: true

    - name: Generate deployment package
      run: zip -r deploy.zip . -x '*.git*'
  
    - name: Deploy to EB
      uses: einaregilsson/beanstalk-deploy@v22
      with:
        aws_access_key: ${{ steps.aws-credentials.outputs.aws-access-key-id }}
        aws_secret_key: ${{ steps.aws-credentials.outputs.aws-secret-access-key }}
        aws_session_token: ${{ steps.aws-credentials.outputs.aws-session-token }}
        application_name: lovely_voicemail_server
        environment_name: init-env 
        version_label: app-240731_212428824536
        region: us-east-1
        deployment_package: deploy.zip
        use_existing_version_if_available: true
